[project]
name = "puc-web-scraper"
version = "0.1.0"
description = "Scraper for the PUC Overheid (NZA) portal — collects documents and stores full text + metadata in DuckDB for downstream RAG pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.4.4",
    "html2text>=2025.4.15",
    "httpx>=0.27",
    "lxml>=5.0",
    "playwright>=1.40.0",
    "pymupdf>=1.26.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.8",
]
