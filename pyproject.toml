[project]
name = "puc-web-scraper"
version = "0.1.0"
description = "Scraper for the PUC Overheid (NZA) portal — collects documents and stores full text + metadata in DuckDB for downstream RAG pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.4.4",
    "html2text>=2025.4.15",
    "httpx>=0.27",
    "lxml>=5.0",
    "pymupdf>=1.26.5",
    "selenium>=4.36.0",
    "webdriver-manager>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors, pyflakes, warnings, isort
ignore = ["E501"]                # line-too-long — enforced by the formatter instead
